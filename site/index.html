<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Pollkadot — US elections, county by county, sized by people</title>
    <meta
      name="description"
      content="Pollkadot maps every US county's election results with each county sized by its population (or votes, electoral votes, GDP and more), from 2008 to today."
    />
    <meta property="og:title" content="Pollkadot" />
    <meta property="og:description" content="US elections, county by county, sized by people." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/styles.css" />

    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="title"><button class="dd" id="ddYear"></button> <button class="dd" id="ddRace"></button></div>
        <div id="pv">
          <div id="pvnames"></div>
          <div id="pvbar"></div>
        </div>
        <div id="pvcap"></div>
        <div class="hbtns">
          <button class="hbtn" id="exportBtn" title="Save the full map as a PNG" aria-label="Export PNG">
            <svg
              width="15"
              height="15"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M8 2.5v7.5M4.8 7l3.2 3.2L11.2 7M3 12.5h10" /></svg
            ><span class="t"></span>
          </button>
          <button class="hbtn" id="infobtn" title="Details and sources">
            <svg
              width="15"
              height="15"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            >
              <circle cx="8" cy="8" r="6.2" />
              <path d="M8 7.2v4" />
              <circle cx="8" cy="4.8" r=".4" fill="currentColor" /></svg
            ><span class="t">Details</span>
          </button>
        </div>
      </header>
      <div id="stage">
        <canvas id="map"></canvas>
        <div id="busy">Loading shapes…</div>
        <div id="tip" class="tipbox"></div>
        <div id="chips" role="toolbar" aria-label="Map settings">
          <button class="chip" id="cMethod" aria-haspopup="menu"></button>
          <button class="chip" id="ddMetric" aria-haspopup="menu"></button>
          <button class="chip" id="ddCmp" aria-haspopup="menu"></button>
          <button class="chip" id="cColor" aria-haspopup="menu"></button>
          <button class="chip" id="cShow" aria-haspopup="menu"></button>
          <button class="chip" id="cBorders" aria-haspopup="menu"></button>
        </div>
        <div id="bottom">
          <div class="zoombtns">
            <button class="mapbtn" id="zin" title="Zoom in" aria-label="Zoom in">
              <svg
                width="14"
                height="14"
                viewBox="0 0 14 14"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              >
                <path d="M7 2v10M2 7h10" />
              </svg>
            </button>
            <button class="mapbtn" id="zout" title="Zoom out" aria-label="Zoom out">
              <svg
                width="14"
                height="14"
                viewBox="0 0 14 14"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              >
                <path d="M2 7h10" />
              </svg>
            </button>
          </div>
          <div id="legcard">
            <div class="legwrap">
              <div id="legend">
                <div id="elabs"><span id="elLo"></span><span id="elHi"></span></div>
                <div id="curvebox"><canvas id="hist"></canvas></div>
                <div id="legends"><span id="lgA"></span><span id="lgB"></span><span id="lgC"></span></div>
                <div id="chip">
                  <div class="in">
                    <span id="chiptxt"></span
                    ><button id="clearSel" title="Clear selection (Esc)" aria-label="Clear selection">✕</button>
                  </div>
                </div>
              </div>
              <div class="lz">
                <button class="mapbtn" id="lzin" title="Zoom into the scale">
                  <svg
                    width="12"
                    height="12"
                    viewBox="0 0 14 14"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  >
                    <path d="M7 2v10M2 7h10" />
                  </svg></button
                ><button class="mapbtn" id="lzout" title="Zoom out the scale">
                  <svg
                    width="12"
                    height="12"
                    viewBox="0 0 14 14"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  >
                    <path d="M2 7h10" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="scrim"></div>
    <div id="menu"><div id="menuin"></div></div>
    <div id="pvtip" class="tipbox"></div>
    <div id="sheet"><div id="sheetbox"></div></div>
  </body>
</html>
