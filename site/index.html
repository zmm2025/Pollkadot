<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pollkadot — US elections, county by county, sized by people</title>
<meta name="description" content="Pollkadot maps every US county's election results with each county sized by its population (or votes, electoral votes, GDP and more), from 2008 to today.">
<meta property="og:title" content="Pollkadot"><meta property="og:description" content="US elections, county by county, sized by people.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='1.75 2.3 12.5 12.5'%3E%3Ccircle cx='5.5' cy='6' r='3.55' fill='%232f6fd8'/%3E%3Ccircle cx='11.6' cy='5.4' r='2.45' fill='%23796ba9'/%3E%3Ccircle cx='4.4' cy='12.4' r='1.95' fill='%23ab5d78'/%3E%3Ccircle cx='10.4' cy='11.6' r='2.95' fill='%23d63b3b'/%3E%3C/svg%3E">
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e3e1dc;--chip:#ecebe6;--hover:#e2e0da;--dem:#2f6fd8;--rep:#d63b3b;--oth:#bdbbb6}
@media (prefers-color-scheme: dark){:root{--bg:#141416;--panel:#1f1f23;--ink:#ececee;--muted:#9a9aa1;--line:#2e2e34;--chip:#2a2a2f;--hover:#36363c;--oth:#55555b}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%}
/* header: one line on desktop, title above the vote bar on phones */
header{position:relative;z-index:6;display:flex;align-items:center;gap:20px;padding:8px 14px;min-height:54px;background:var(--panel);border-bottom:1px solid var(--line)}
.title{font-size:21px;font-weight:700;letter-spacing:-.015em;line-height:1.25;white-space:nowrap;flex:none}
.dd{border:0;background:none;padding:0;margin:0;font:inherit;letter-spacing:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-decoration-thickness:2px;text-underline-offset:4px;transition:text-decoration-color .12s}
.dd:hover,.dd:focus-visible,.dd.open{text-decoration-color:var(--muted);outline:none}
.hbtns{margin-left:auto;display:flex;gap:6px;flex:none}
.hbtn{display:flex;align-items:center;gap:6px;height:30px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:0 11px 0 8px;font-size:12.5px;cursor:pointer;color:var(--muted);transition:background .12s,color .12s;white-space:nowrap}
.hbtn:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.hbtn svg{display:block;flex:none}
.hbtn .t:empty{display:none}
#exportBtn:has(.t:empty){padding:0 7px}
#infobtn.warn{color:#b97800;border-color:#e6c27a;background:rgba(224,161,0,.1)}
@media (prefers-color-scheme: dark){#infobtn.warn{color:#f0b429;border-color:#6b5320;background:rgba(240,180,41,.1)}}
#pv{flex:0 1 440px;min-width:0;position:relative;container-type:inline-size}
#pvnames{display:flex;justify-content:space-between;font-size:12.5px;font-variant-numeric:tabular-nums;gap:8px;white-space:nowrap}
#pvnames b{font-weight:650}
#pvnames .ab{display:none}
@container (max-width:270px){#pvnames .fn{display:none}#pvnames .ab{display:inline}}
@container (max-width:340px){#pvnames .oth{display:none}}
#pvbar{height:8px;border-radius:4px;overflow:hidden;display:flex;background:var(--chip);margin-top:4px}
#pvbar div{transition:filter .1s}#pvbar div:hover{filter:brightness(1.12)}
#pvcap{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:900px){#pvcap{display:none}}
@media (max-width:640px){
  header{display:grid;grid-template-columns:1fr auto;gap:7px 10px;padding:10px 14px 0;min-height:0;background:var(--bg);border-bottom:0}
  .title{font-size:19px}
  #pv{grid-column:1/-1;grid-row:2}
  .hbtns{grid-column:2;grid-row:1}
  #infobtn .t{display:none}#infobtn{padding:0 7px}
}
#stage{position:relative;flex:1;min-height:200px;touch-action:none;overflow:hidden;background:var(--bg)}
canvas#map{position:absolute;inset:0;width:100%;height:100%;display:block}
#busy{position:absolute;left:50%;top:58px;transform:translateX(-50%);font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;display:none;z-index:5}
/* chip row: one dropdown per setting, scrolls sideways when it doesn't fit */
#chips{position:absolute;left:0;right:0;top:0;z-index:4;display:flex;gap:6px;padding:10px 14px 6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain}
#chips::-webkit-scrollbar{display:none}
#chips.scr{cursor:grab}#chips.drag{cursor:grabbing}
#chips.fr{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
#chips.fl{-webkit-mask-image:linear-gradient(90deg,transparent,#000 36px);mask-image:linear-gradient(90deg,transparent,#000 36px)}
#chips.fl.fr{-webkit-mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent)}
body.mopen #chips{z-index:21}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px 0 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13.5px;font-weight:550;white-space:nowrap;overflow:hidden;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:background .12s,border-color .12s}
.chip .ic{color:var(--muted)}
.chip .chev{color:var(--muted);font-size:10px;display:inline-block;transition:transform .16s}
.chip:hover:not([aria-disabled=true]){background:var(--hover)}
.chip.open{background:var(--hover);border-color:var(--muted)}.chip.open .chev{transform:rotate(180deg)}
.chip[aria-disabled=true]{opacity:.5;cursor:default}
.chip:focus-visible,.hbtn:focus-visible,.mapbtn:focus-visible{outline:2px solid var(--dem);outline-offset:2px}
/* bottom overlay: zoom bottom-left + legend bottom-right; on phones zoom sits above a full-width legend */
#bottom{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}
#bottom>*{pointer-events:auto}
#legcard{width:340px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 8px 4px 10px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
@media (max-width:640px){#bottom{flex-direction:column;align-items:stretch}#bottom .zoombtns{display:none}#legcard{width:auto}}
.tipbox{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;box-shadow:0 8px 28px rgba(0,0,0,.16);min-width:200px;max-width:280px;display:none;z-index:25;text-align:left}
.tipbox b{font-size:14px}.sub{color:var(--muted);font-size:12px}
#pvtip{position:fixed}
.bar{height:6px;border-radius:3px;margin:7px 0 5px;overflow:hidden;display:flex;background:var(--chip)}
.tipbox table{border-collapse:collapse;width:100%}.tipbox td{padding:1px 0}.tipbox td:last-child{text-align:right;font-variant-numeric:tabular-nums;padding-left:10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.ratio{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:12px}
.mapbtn{border:1px solid var(--line);background:var(--panel);border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s}
.mapbtn:hover:not(:disabled){background:var(--hover)}.mapbtn:disabled{opacity:.35;cursor:default}
.zoombtns{display:flex;flex-direction:column;gap:6px}
.zoombtns .mapbtn{width:34px;height:34px;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.mapbtn svg{display:block}
.pill{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:7px 10px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.pill:hover{background:var(--hover)}
.ic{width:16px;height:16px;flex:none;display:block}
.legwrap{display:flex;gap:8px;align-items:stretch}
#legend{position:relative;flex:1;min-width:0;height:104px;touch-action:none;user-select:none}
#elabs{position:absolute;left:0;right:0;top:0;height:16px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
#elabs span{position:absolute;top:0;white-space:nowrap;display:none}
#curvebox{position:absolute;left:0;right:0;top:18px;height:52px;cursor:crosshair}
#hist{position:absolute;inset:0;width:100%;height:100%}
#legends{position:absolute;left:0;right:0;top:72px;font-size:10.5px;color:var(--muted);pointer-events:none;line-height:12px;height:12px}
#legends span{position:absolute;top:0;white-space:nowrap}
#chip{position:absolute;top:94px;height:0;display:none}
#chip .in{position:absolute;transform:translate(-50%,-50%);top:0;display:flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
#chip b{font-weight:650}
#clearSel{border:0;background:none;border-radius:999px;width:20px;height:20px;cursor:pointer;color:var(--muted);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
#clearSel:hover{background:var(--hover);color:var(--ink)}
.lz{display:flex;flex-direction:column;gap:4px;justify-content:center}
.lz .mapbtn{width:24px;height:24px;font-size:14px;border-radius:7px}
/* dropdown menu: grows out of the control that opened it (transform-origin + caret sit at the control's centre) */
#menu{position:fixed;z-index:22;display:none;opacity:0;transform:translateY(-4px) scale(.92);transition:opacity 90ms ease-in,transform 90ms ease-in}
#menu.up{transform:translateY(4px) scale(.92)}
#menu.show{opacity:1;transform:none;transition:opacity 170ms cubic-bezier(.2,.8,.2,1),transform 170ms cubic-bezier(.2,.8,.2,1)}
#menu::before{content:"";position:absolute;left:calc(var(--ax,50%) - 6px);top:-5px;width:11px;height:11px;background:var(--panel);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg);z-index:1}
#menu.up::before{top:auto;bottom:-5px;transform:rotate(225deg)}
#menuin{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.22);padding:6px;min-width:230px;max-width:min(360px,calc(100vw - 20px));overflow:auto;overscroll-behavior:contain}
#menu.wide #menuin{max-width:none}
#menu .mh{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:6px 10px 4px}
#menu button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:14px}
#menu button:hover:not(:disabled){background:var(--hover)}
#menu button .ic{color:var(--muted)}
#menu button .lab{flex:1;min-width:0;font-weight:600}
#menu button .ck{width:14px;flex:none;text-align:center;visibility:hidden}
#menu button.on{background:var(--chip)}#menu button.on .ck{visibility:visible}#menu button.on .ic{color:var(--ink)}
#menu button:disabled{opacity:.4;cursor:default}
#menu .d{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}
#menu .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
#menu .grid button{justify-content:center}
#scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity 150ms}
#scrim.show{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){#menu,#menu.up,#menu.show{transform:none;transition:opacity 80ms linear}#scrim{transition:opacity 80ms linear}.chip .chev{transition:none}}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:30;align-items:flex-end;justify-content:center}
#sheet.show{display:flex}
#sheetbox{background:var(--panel);width:100%;max-width:640px;max-height:84%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 18px 26px;font-size:13.5px;line-height:1.45}
#sheetbox h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 6px}
#sheetbox h3:first-of-type{margin-top:4px}
#sheetbox p{margin:6px 0}#sheetbox ul{margin:4px 0;padding-left:18px}#sheetbox li{margin:3px 0}
#sheetbox .x{float:right;border:0;background:var(--chip);border-radius:999px;width:30px;height:30px;font-size:16px;cursor:pointer}
#sheetbox .x:hover{background:var(--hover)}
code{font-size:12px;background:var(--chip);padding:1px 4px;border-radius:4px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title"><button class="dd" id="ddYear"></button> <button class="dd" id="ddRace"></button></div>
    <div id="pv"><div id="pvnames"></div><div id="pvbar"></div></div>
    <div id="pvcap"></div>
    <div class="hbtns">
      <button class="hbtn" id="exportBtn" title="Save the full map as a PNG" aria-label="Export PNG" style="display:none"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v7.5M4.8 7l3.2 3.2L11.2 7M3 12.5h10"/></svg><span class="t"></span></button>
      <button class="hbtn" id="infobtn" title="Details and sources"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.2v4"/><circle cx="8" cy="4.8" r=".4" fill="currentColor"/></svg><span class="t">Details</span></button>
    </div>
  </header>
  <div id="stage">
    <canvas id="map"></canvas><div id="busy">Loading shapes…</div><div id="tip" class="tipbox"></div>
    <div id="chips" role="toolbar" aria-label="Map settings">
      <button class="chip" id="cMethod" aria-haspopup="menu"></button>
      <button class="chip" id="ddMetric" aria-haspopup="menu"></button>
      <button class="chip" id="ddCmp" aria-haspopup="menu"></button>
      <button class="chip" id="cColor" aria-haspopup="menu"></button>
      <button class="chip" id="cShow" aria-haspopup="menu"></button>
      <button class="chip" id="cBorders" aria-haspopup="menu"></button>
    </div>
    <div id="bottom">
      <div class="zoombtns">
        <button class="mapbtn" id="zin" title="Zoom in" aria-label="Zoom in"><svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M7 2v10M2 7h10"/></svg></button>
        <button class="mapbtn" id="zout" title="Zoom out" aria-label="Zoom out"><svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2 7h10"/></svg></button>
      </div>
      <div id="legcard">
        <div class="legwrap">
          <div id="legend">
            <div id="elabs"><span id="elLo"></span><span id="elHi"></span></div>
            <div id="curvebox"><canvas id="hist"></canvas></div>
            <div id="legends"><span id="lgA"></span><span id="lgB"></span><span id="lgC"></span></div>
            <div id="chip"><div class="in"><span id="chiptxt"></span><button id="clearSel" title="Clear selection (Esc)" aria-label="Clear selection">✕</button></div></div>
          </div>
          <div class="lz"><button class="mapbtn" id="lzin" title="Zoom into the scale"><svg width="12" height="12" viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 2v10M2 7h10"/></svg></button><button class="mapbtn" id="lzout" title="Zoom out the scale"><svg width="12" height="12" viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 7h10"/></svg></button></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="scrim"></div><div id="menu"><div id="menuin"></div></div><div id="pvtip" class="tipbox"></div>
<div id="sheet"><div id="sheetbox"></div></div>
<script>
"use strict";
// ================= OKLab =================
function s2l(c){c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4)}
function l2s(c){c=c<=0.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-0.055;return Math.max(0,Math.min(255,Math.round(c*255)))}
function hexToLab(h){const n=parseInt(h.slice(1),16);const r=s2l(n>>16&255),g=s2l(n>>8&255),b=s2l(n&255);
  const l=Math.cbrt(0.4122214708*r+0.5363325363*g+0.0514459929*b),m=Math.cbrt(0.2119034982*r+0.6806995451*g+0.1073969566*b),s=Math.cbrt(0.0883024619*r+0.2817188376*g+0.6299787005*b);
  return [0.2104542553*l+0.7936177850*m-0.0040720468*s,1.9779984951*l-2.4285922050*m+0.4505937099*s,0.0259040371*l+0.7827717662*m-0.8086757660*s]}
function labToRgb(L,a,b){const l=Math.pow(L+0.3963377774*a+0.2158037573*b,3),m=Math.pow(L-0.1055613458*a-0.0638541728*b,3),s=Math.pow(L-0.0894841775*a-1.2914855480*b,3);
  return [l2s(4.0767416621*l-3.3077115913*m+0.2309699292*s),l2s(-1.2684380046*l+2.6097574011*m-0.3413193965*s),l2s(-0.0041960695*l-0.7034186147*m+1.7076147010*s)]}
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
const DEM=hexToLab('#2f6fd8'),REP=hexToLab('#d63b3b'),NONE=hexToLab(dark?'#3a3a40':'#d9d7d2');
const LUTN=1024,LUT=new Uint8ClampedArray(3*(LUTN+1));
for(let i=0;i<=LUTN;i++){const t=i/LUTN;const c=labToRgb(DEM[0]+(REP[0]-DEM[0])*t,DEM[1]+(REP[1]-DEM[1])*t,DEM[2]+(REP[2]-DEM[2])*t);LUT[3*i]=c[0];LUT[3*i+1]=c[1];LUT[3*i+2]=c[2]}
const NONERGB=labToRgb(NONE[0],NONE[1],NONE[2]);
const lutCss=t=>{const i=3*Math.round(Math.min(1,Math.max(0,t))*LUTN);return`rgb(${LUT[i]},${LUT[i+1]},${LUT[i+2]})`};
function colorOf(t,none){const L=[DEM[0]+(REP[0]-DEM[0])*t,DEM[1]+(REP[1]-DEM[1])*t,DEM[2]+(REP[2]-DEM[2])*t];
  if(none>0)for(let k=0;k<3;k++)L[k]+=(NONE[k]-L[k])*none;const c=labToRgb(L[0],L[1],L[2]);return 'rgb('+c[0]+','+c[1]+','+c[2]+')'}
// ================= data =================
async function gunzip(buf){return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()}
async function getBin(path){const r=await fetch(path);if(!r.ok)throw new Error(path+' '+r.status);return gunzip(await r.arrayBuffer())}
let D,NC,NP,E,ringPt,ringStart,countyRing,circParam;const shared={},cache={};
let NS,SIDS,stOf,stMembers,stRep,stCent,stArcs;  // state structures
const KM2=35.4527;
function decodeShared(buf){const d=new Int16Array(buf);const fr=D.frame;const out=new Float32Array(2*NP);let x=0,y=0;for(let i=0;i<NP;i++){x+=d[2*i];y+=d[2*i+1];out[2*i]=fr.x0+x/fr.q;out[2*i+1]=fr.y0+y/fr.q}return out}
function expandShared(s){const o=new Float32Array(2*E);for(let k=0;k<E;k++){const p=ringPt[k];o[2*k]=s[2*p];o[2*k+1]=s[2*p+1]}return o}
function expandCircles(c){const o=new Float32Array(2*E);for(let i=0;i<NC;i++){const cx=c[i],cy=c[NC+i],r=c[2*NC+i];for(const ri of countyRing[i])for(let k=ringStart[ri];k<ringStart[ri+1];k++){const a=circParam[k];if(a!==a||r===0){o[2*k]=cx;o[2*k+1]=cy}else{o[2*k]=cx+r*Math.cos(a);o[2*k+1]=cy+r*Math.sin(a)}}}return o}
const weightsFor=(m,k)=>D.weights[m+'|'+k];
function stateSum(arr){const o=new Float64Array(NS);for(let i=0;i<NC;i++)o[stOf[i]]+=arr[i];return o}
// ---- layouts ----
function placeCircles(metric,key){const w=weightsFor(metric,key),k=D.scales[metric],c=new Float32Array(3*NC);for(let i=0;i<NC;i++){c[i]=D.cent[i][0];c[NC+i]=D.cent[i][1];c[2*NC+i]=Math.sqrt(Math.max(0,w[i])*k/Math.PI)}return c}
function stateCircles(metric,key,packed){ // one circle per state, stored on the state's representative county

  h+=`<p><b>Color.</b> Vote share is R ÷ (D + R), blended between blue and red in OKLab. Winner is fully blue or red. Where circles overlap, colors blend by each one's votes per unit of area. Gray means no race, or no data in the source.</p>`;
  h+=`<p><b>Curve in the corner.</b> How much of the current size measure sits at each vote share. Hover to preview; click or drag to select a range (edges snap to exact ${UNIT().one} values, whole points and tenths); drag the middle to move it, the edges to resize. Scroll over it, or use + and −, to zoom the scale.</p><h3>This race</h3>`;
  if(c.note)h+=`<p>${c.note}</p>`;if(c.gaps&&c.gaps.length)h+=`<p><b>Gaps in the source data:</b></p><ul>${c.gaps.map(g=>`<li>${g}</li>`).join('')}</ul>`;if(c.statewide&&c.statewide['02'])h+=`<p>Alaska reports by state-house district, so every borough shows the statewide result.</p>`;h+=`<p class="sub">Results: ${c.src}.</p>`;
  h+=`<h3>Sources</h3><ul>${D.sources.map(s=>`<li>${s}</li>`).join('')}</ul>`;box.innerHTML=h;sheet.classList.add('show')};

let sel=-1;const tip=document.getElementById('tip');let tipPos=[0,0];
function toMap(px,py){const k=fit.k*view.k;return[(px-(fit.x*view.k+view.x))/k,(py-(fit.y*view.k+view.y))/k]}
function hit(px,py){if(!disp)return -1;const[x,y]=toMap(px,py);
  if(disp.type==='circ'){const c=disp.c;let best=-1,br=1e9;const tol=4/(fit.k*view.k);for(let i=0;i<NC;i++){const r=c[2*NC+i];if(r<=0||(hl&&hf(i)<0.5))continue;const d=Math.hypot(x-c[i],y-c[NC+i]);if(d<=Math.max(r,tol)&&r<br){br=r;best=i}}return best<0?-1:unitOf(best)}
  const p=disp.pos;for(let i=NC-1;i>=0;i--){let inside=false;for(const r of countyRing[i]){const s=ringStart[r],e=ringStart[r+1];for(let a=s,b=e-1;a<e;b=a++){const xa=p[2*a],ya=p[2*a+1],xb=p[2*b],yb=p[2*b+1];if(((ya>y)!==(yb>y))&&(x<(xb-xa)*(y-ya)/(yb-ya)+xa))inside=!inside}}if(inside)return unitOf(i)}return -1}
function valueOf(m,key,u){const w=unitWeights(m,key);if(!w)return null;let v=w[u];if(m==='land'){if(st.gran==='state'){const raw=weightsFor('land','all');v=0;for(const i of stMembers[u])v+=raw[i]*(D.ids[i].startsWith('02')?1/(0.35*0.35):1);v*=KM2}else v=v*KM2*(D.ids[u].startsWith('02')?1/(0.35*0.35):1)}return v}
function valueText(m,key,u){const mi=metricInfo(m);const v=valueOf(m,key,u);return v==null?'':(mi.fmt||'{}').replace('{}',(+v).toLocaleString('en-US',{maximumFractionDigits:mi.dp||0}))}
function shareOf(m,key,u){const w=unitWeights(m,key);if(!w)return null;let s=0;for(const v of w)s+=v;return w[u]/s}
function updateTip(){if(sel<0){tip.style.display='none';drawOverlay();return}
  if(animViewing){tip.style.display='none';drawOverlay();return}
  if(!animViewing&&lastTapZoom){const b=unitBBox(sel);const k=fit.k*view.k;tipPos=[((b[0]+b[2])/2)*k+fit.x*view.k+view.x,b[3]*k+fit.y*view.k+view.y];lastTapZoom=false}
  const c=st.contest,u=sel,U=unitVotes(c);const d=U.d[u],r=U.r[u],o=U.o[u],t=d+r+o;const sfips=st.gran==='state'?SIDS[u]:D.st[u];const cand=(c.cand&&(c.cand[sfips]||c.cand['*']))||{};
  const name=st.gran==='state'?(D.states[SIDS[u]]||{}).name:D.names[u];const subn=st.gran==='state'?(c.office==='HOUSE'?'All districts combined':''):((D.states[D.st[u]]||{}).name||'')+(c.statewide&&c.statewide[D.st[u]]?' · statewide result':'');
  let h=`<b>${name}</b>${subn?`<div class="sub">${subn}</div>`:''}`;
  if(t>0)h+=`<div class="bar"><div style="width:${100*d/t}%;background:var(--dem)"></div><div style="width:${100*o/t}%;background:var(--oth)"></div><div style="width:${100*r/t}%;background:var(--rep)"></div></div><table>
   <tr><td><span class="dot" style="background:var(--dem)"></span>${cand.d||'Democratic'}</td><td>${fmt(d)} · ${pct(d/t)}</td></tr><tr><td><span class="dot" style="background:var(--rep)"></span>${cand.r||'Republican'}</td><td>${fmt(r)} · ${pct(r/t)}</td></tr>
   <tr><td><span class="dot" style="background:var(--oth)"></span>${cand.o?cand.o+' + others':'Others'}</td><td>${fmt(o)} · ${pct(o/t)}</td></tr></table>`;
  else h+=`<div class="sub" style="margin-top:4px">No ${OFF[c.office]} race${st.gran==='county'?' data for this county':' here'} in ${c.year}.</div>`;
  const m=st.metric,wk=wkeyFor(c,m),bm=st.cmp!=='none'?st.cmp:(m==='pop'?null:'pop');
  h+=`<div class="ratio">${metricInfo(m).label}: ${valueText(m,wk,u)}`;
  if(bm){const bk=wkeyFor(c,bm);h+=`<br>${metricInfo(bm).label}: ${valueText(bm,bk,u)}`;const a=shareOf(m,wk,u),b=shareOf(bm,bk,u);if(a!=null&&b>0){const q=a/b;h+=`<br><b>${q>=10||q<0.1?q.toPrecision(2):q.toFixed(2)}×</b> its share of ${metricInfo(bm).label.toLowerCase()}`}}
  h+='</div>';tip.innerHTML=h;tip.style.display='block';const tw=tip.offsetWidth,th=tip.offsetHeight;let[x,y]=tipPos;x=Math.min(Math.max(6,x+12),W-tw-6);y=y+14+th>H?y-th-14:y+14;tip.style.left=x+'px';tip.style.top=Math.max(4,y)+'px';drawOverlay()}
const pts=new Map();let gest=null,moved=false;
cv.addEventListener('contextmenu',e=>e.preventDefault());cv.addEventListener('auxclick',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{if(e.button===1||e.button===2){e.preventDefault();auxDrag=true}tapButton=e.button;cv.style.cursor='grabbing';viewAnim++;animViewing=false;cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.offsetX,e.offsetY]);moved=false;gest=null});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId)){if(e.pointerType==='mouse'){const i=hit(e.offsetX,e.offsetY);tipPos=[e.offsetX,e.offsetY];cv.style.cursor=i>=0?'pointer':'default';if(i!==sel){sel=i;updateTip()}else if(sel>=0)updateTip()}return}
  const prev=pts.get(e.pointerId);pts.set(e.pointerId,[e.offsetX,e.offsetY]);
  if(pts.size===1){const dx=e.offsetX-prev[0],dy=e.offsetY-prev[1];if(Math.abs(dx)+Math.abs(dy)>0.5)moved=true;view.x+=dx;view.y+=dy;tip.style.display='none';markInteracting();requestDraw()}
  else if(pts.size===2){const[a,b]=[...pts.values()];const dist=Math.hypot(a[0]-b[0],a[1]-b[1]);const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;if(gest){zoomAt(mx,my,dist/gest.d);view.x+=mx-gest.mx;view.y+=my-gest.my}gest={d:dist,mx,my};moved=true;markInteracting();requestDraw()}});
function unitBBox(u){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  if(disp.type==='circ'){const c=disp.c;const i=st.gran==='state'?stRep[u]:u;const r=Math.max(c[2*NC+i],2/fit.k);return[c[i]-r,c[NC+i]-r,c[i]+r,c[NC+i]+r]}
  const list=st.gran==='state'?stMembers[u]:[u];for(const i of list)for(const r of countyRing[i])for(let k=ringStart[r];k<ringStart[r+1];k++){const x=disp.pos[2*k],y=disp.pos[2*k+1];if(x<x0)x0=x;if(y<y0)y0=y;if(x>x1)x1=x;if(y>y1)y1=y}return[x0,y0,x1,y1]}
let animViewing=false,lastTapZoom=false;
function zoomToUnit(u){lastTapZoom=true;const[x0,y0,x1,y1]=unitBBox(u);const cx=(x0+x1)/2,cy=(y0+y1)/2;const span=Math.max(x1-x0,y1-y0,1e-6);
  let k=Math.min(40,Math.max(1,0.42*Math.min(W,H)/(span*fit.k)));const x=W/2-(cx*fit.k+fit.x)*k,y=H/2-(cy*fit.k+fit.y)*k;animateView(k===1?{k:1,x:0,y:0}:{k,x,y})}
let tapButton=0;
function end(e){cv.style.cursor='default';if(pts.size===1&&!moved&&tapButton===0){sel=hit(e.offsetX,e.offsetY);tipPos=[e.offsetX,e.offsetY];if(sel>=0)zoomToUnit(sel);updateTip()}pts.delete(e.pointerId);if(pts.size<2)gest=null}
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);gest=null;cv.style.cursor='default'});
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!pts.size){sel=-1;updateTip()}});
function zoomAt(px,py,f){const nk=Math.max(1,Math.min(60,view.k*f));f=nk/view.k;view.x=px-(px-view.x)*f;view.y=py-(py-view.y)*f;view.k=nk;if(nk===1){view.x=0;view.y=0}}
cv.addEventListener('wheel',e=>{e.preventDefault();viewAnim++;animViewing=false;zoomAt(e.offsetX,e.offsetY,Math.exp(-(e.deltaMode===1?e.deltaY*16:e.deltaY)*(e.ctrlKey?0.01:0.0015)));tip.style.display='none';markInteracting();requestDraw()},{passive:false});
let viewAnim=0;function animateView(to){const id=++viewAnim;const from={...view},t0=performance.now();animViewing=true;const s=now=>{if(id!==viewAnim){animViewing=false;return}const e=ease(Math.min(1,(now-t0)/350));view={k:from.k+(to.k-from.k)*e,x:from.x+(to.x-from.x)*e,y:from.y+(to.y-from.y)*e};if(e>=1)view={...to};tip.style.display='none';markInteracting();draw();if(e<1)requestAnimationFrame(s);else{animViewing=false;if(sel>=0)updateTip()}};requestAnimationFrame(s)}
document.getElementById('zin').onclick=()=>{animateView(zoomed(1.6))};document.getElementById('zout').onclick=()=>{animateView(zoomed(1/1.6))};
function zoomed(f){const v0={...view};zoomAt(W/2,H/2,f);const v1={...view};view=v0;return v1}
window.addEventListener('resize',()=>D&&resize());try{const ro=new ResizeObserver(()=>{if(D)resize()});for(const id of ['stage','chips','legcard'])ro.observe(document.getElementById(id))}catch(e){}
(async()=>{try{
  D=JSON.parse(new TextDecoder().decode(await getBin('data/core.bin')));NC=D.names.length;NP=D.nPts;
  shared[D.variants.geo.file]=shared.geo=decodeShared(await getBin(D.variants.geo.file));buildGeometry();D.allArcs=[...Array(D.arcOff.length-1).keys()];
  const only={votes:'Presidential races only',ev:'Presidential races only',senate:'Senate races only'};D.metrics.forEach(m=>m.only=only[m.key]||'Not available for this race');
  st.method=D.defaultMethod;const h=location.hash.slice(1);const c=D.contests.find(x=>x.key===h)||D.contests.find(x=>x.key===D.defaultKey);resize();pick(c);
